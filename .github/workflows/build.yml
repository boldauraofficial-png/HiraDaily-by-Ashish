name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract and build APK
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          PUBSPEC=$(find extracted -name pubspec.yaml -print -quit)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found in ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")
          cd "$PROJECT_DIR"
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release

          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/app-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HiraDaily-APK
          path: app-release.apk
